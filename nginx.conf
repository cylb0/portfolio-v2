server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Le TLS et la canonicalisation d'hote sont geres par le reverse proxy en
    # amont : ici on ne fait que servir le SPA. L'origine ne connait ni le
    # schema ni l'hote reel du client, donc on emet des Location relatives :
    # sans absolute_redirect off, nginx reconstruirait $scheme://$host et
    # renverrait une URL http a corriger par un second 301.
    absolute_redirect off;

    # /index.html est un doublon de / pour Google
    location = /index.html {
        return 301 /;
    }

    # Routes du routeur React, servies par le meme index.html.
    # Toute route non listee ici doit repondre 404 : sans ca, /nimporte-quoi
    # renvoie un 200 avec le contenu de la home et Google y voit des doublons.
    location = / {
        try_files /index.html =404;
    }

    location = /legal-notice {
        try_files /index.html =404;
    }

    # Variante avec slash final -> URL canonique sans slash
    location = /legal-notice/ {
        return 301 /legal-notice;
    }

    # Fichiers statiques (assets hashes, favicon, models, screenshots)
    location / {
        try_files $uri =404;
    }
}
